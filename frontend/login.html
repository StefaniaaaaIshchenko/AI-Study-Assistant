<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — AI Study Assistant</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main>
        <p class="brand">AI Study Assistant</p>
        <h2>З поверненням</h2>
        <p class="subtitle">Увійди, щоб продовжити навчання</p>

        <form id="login-form">
            <label for="email">Email</label>
            <div class="field"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><input type="email" id="email" name="email" placeholder="you@example.com" required></div>
            <label for="password">Пароль</label>
            <div class="field"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input type="password" id="password" name="password" placeholder="Твій пароль" required></div>
            <button type="submit">Увійти</button>
        </form>

        <p class="switch">Ще немає акаунта? <a href="register.html">Зареєструватися</a></p>
        <a class="back" href="index.html">← На головну</a>
    </main>
    <script src="login.js"></script>
</body>
</html>
